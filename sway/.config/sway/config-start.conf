
# keys

set $alt Mod1

set $mod Mod4


# programs 

set $term kitty

set $menu wofi --show drun

set $lock swaylock --color e5e5e5ff

set $idle swayidle

set $prtscr grim -g "$(slurp -d)" -


# font

font pango:monospace 11


# swayidle setup 
# - 10m - lock the screen
# - 15m - suspend the machine
exec $idle \
    timeout 600 '$lock' \
    timeout 900 'systemctl suspend' \
    before-sleep '$lock -f'


# status bar

bar {
    status_command i3status
}


# wallpaper

output * background  ~/images/wallpaper/1920x1080.png fill #000000


# light

exec gammastep -O 5000
